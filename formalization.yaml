fidelity:
  divergences: >-
    Differences between the compared theorem and Theorem 1.2 as printed (in full: DEVIATIONS.md,
    entry B14). (1) The velocity is a Lipschitz function rather than a W^{1,infinity} class, and
    divergence-free means sum_i m_i u_i^(m) = 0 for every m in Z^3: equivalent. (2) L^2_sigma is the
    orthogonal complement of the gradients of the Fourier characters, and H^2 is defined by Fourier
    weights: equivalent. (3) The operator curl(u x B) + eps Laplacian(B) is given by its Fourier
    symbol, with the curl in the divergence form sum_j d_j(u_i B_j - u_j B_i): equivalent. (4) The
    growth rate gamma(u, eps) is not defined. The clause asserts the existence of a strongly
    continuous semigroup on L^2_sigma whose generator agrees with the operator on H^2 and L^2_sigma,
    and bounds the operator norm of every such semigroup below by exp(gamma0 t) for all t >= 0. The
    library proves Lemma A.1 of the paper for velocities independent of x3 (DEVIATIONS.md, CA.1),
    which covers the velocity of the theorem, and the semigroup it gives is such a semigroup. That
    it is the only one (a generator has no proper extension that is again a generator) is a standard
    argument that is not formalised for this notion; the compared theorem asserts existence only,
    does not use uniqueness, and its clauses hold for every such semigroup. For a strongly
    continuous semigroup gamma(u, eps) = lim t^-1 log ||S(t)|| = inf_{t>0} t^-1 log ||S(t)||, so the
    bound is equivalent to gamma(u, eps) >= gamma0 for every 0 < eps <= eps0, the interval on which
    the paper states the growth clause, and it gives the liminf clause: equivalent. (5) The
    eigenmode exp(2 pi i K x3) b(y) is expressed as Fourier support on m3 = K; b in H^2 and b != 0
    become V in H^2 and V != 0; the eigen-equation holds in the sense of distributions, on Fourier
    coefficients. (6) "Its solution" is the semigroup orbit for t >= 0; real fields are C^3-valued
    with real entries. (7) The particle flow is characterised through integral curves of the
    periodic lift of u; its existence is asserted and the entropy clause holds for every such flow;
    topological entropy is mathlib's Dynamics.coverEntropy, the Bowen-Dinaburg entropy defined
    through covers by dynamical balls. (8) The ideal solution group is the unique strongly
    continuous group on L^2_sigma whose orbits solve dB/dt = curl(u x B) tested against the Fourier
    characters and integrated in time. (9) One existential block over u, eps0, gamma0, with one
    triple (K, lambda, V) for each eps. (10) Not stated in the compared theorem, but proved in the
    library: the explicit eps0 and gamma0 >= 288, the independence of u of x3, u != 0, Remark 1.5,
    Lemma A.1, Remarks 1.6 and 1.7, Corollary 8.3. The library proves the theorem in a product-torus
    model T^2 x T and transports it to UnitAddTorus (Fin 3); the deviations of the library's own
    statements and arguments from the paper (the model, solution classes, choices of constants,
    different routes) are listed in DEVIATIONS.md.

review:
  status: "author-verified"
  reviewers:
    - "Lukas Niebel"
  notes: >-
    Lean checks each proof against its formal statement. The author reviewed that the statements
    are the intended theorems. Each public statement was compared with the paper by independent
    model reviews before its proof was accepted, and the comparator declaration is checked
    mechanically. This is not external peer review.

alignment:
  namespace: "FastDynamoChallenge"
  statements:
    - source: "Theorem 1.2 (thm:main)"
      lean: "FastDynamoChallenge.fast_dynamo_zero_entropy"
      module: "Solution"
      status: "proved"
      note: >-
        The compared theorem; its statement is that of Challenge.lean, with the differences from
        the printed theorem listed under fidelity.divergences.
    - source: "Theorem 1.2 (thm:main), in the library's own terms"
      lean: "FastDynamo.mainTheoremComplete_holds"
      module: "FastDynamo.Dynamics.MainLagrangianClauses"
      status: "proved"
      note: >-
        Every clause of the theorem at explicit witnesses, in the product model; deviations in
        DEVIATIONS.md, Part B.
    - source: "Theorem 1.2 (thm:main), with explicit constants"
      lean: "FastDynamo.main_theorem_strengthened"
      module: "FastDynamo.MainTheoremStrengthened"
      status: "proved"
      note: >-
        Explicit eps0 and gamma0 >= 288, the growth-rate clause, the semigroup orbit and the
        literal three-torus clauses.
    - source: "Lemma A.1 (lem:semigroup-spectral-growth)"
      lean: "FastDynamo.semigroupSpectralGrowth_holds"
      module: "FastDynamo.Dynamics.Assembly.SemigroupSpectralGrowth"
      status: "proved"
      note: "For axially independent divergence-free velocities; DEVIATIONS.md, CA.1."
    - source: "Remark 1.7"
      lean: "FastDynamo.tendstoUniformlyOn_resistiveEvolution_mainIdealGroup"
      module: "FastDynamo.Dynamics.VanishingDiffusivity.Limit"
      status: "proved"
      note: "At the velocity of Theorem 1.2; DEVIATIONS.md, C1.5."
    - source: "Corollary 8.3 (cor:magnetic-scale)"
      lean: "FastDynamo.main_theorem_magnetic_scale"
      module: "FastDynamo.Finish.MagneticScaleMain"
      status: "proved"
      note: "With explicit constants; DEVIATIONS.md, C8.2."

