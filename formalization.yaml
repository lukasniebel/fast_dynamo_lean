# formalization.yaml v0.4: provenance, sources, process and review of this formalisation.
version: "v0.4"

project:
  name: "A fast dynamo with zero topological entropy"
  description: >-
    A Lean 4 formalisation, built on mathlib, of L. Niebel, "A fast dynamo with zero topological
    entropy" (arXiv:2608.02586v3), an arXiv preprint. The fast-dynamo question, going back to
    Vainshtein and Zel'dovich, asks whether the exponential growth rate of the magnetic field in the
    kinematic induction equation survives the limit of vanishing magnetic diffusivity; for
    autonomous velocities on the flat three-torus it is the conjecture recorded as Problem 1994-28
    in Arnold's Problems (Conjecture 1.1 of the paper), which asks for a smooth velocity. For
    sufficiently smooth velocities the absence of exponential particle stretching excludes fast
    dynamo action (Vishik; Friedlander and Vishik), and the entropy bound of Klapper and Young
    excludes a C^infinity fast dynamo with zero topological entropy; the paper shows that at
    Lipschitz regularity fast dynamo action is compatible with zero topological entropy and zero
    ideal exponential growth. The theorem concerns Lipschitz velocities and does not address the
    smooth conjecture, which, as Remark 1.3 of the paper records, has been resolved (Coti Zelati,
    Sorella and Villringer, arXiv:2609.04153). The
    compared theorem is Theorem 1.2 of the paper: there are an autonomous, divergence-free,
    Lipschitz velocity field u on the flat torus T^3 = R^3/Z^3 and constants eps0, gamma0 > 0 such
    that for every magnetic diffusivity 0 < eps <= eps0 the kinematic induction equation dB/dt =
    curl(u x B) + eps Laplacian(B), div B = 0, has an induction semigroup on the divergence-free
    fields L^2_sigma whose operator norm is at least exp(gamma0 t) for all t >= 0 (u is a fast
    dynamo), with an eigenmode exp(2 pi i K x3) b(y) of eigenvalue of real part at least gamma0 and
    a real solution of exact growth exp(t Re lambda); while every time map of the particle flow of u
    is continuous and has topological entropy zero, and the ideal (eps = 0) induction equation has
    exactly one solution group, whose operator norm grows subexponentially. The statement in
    Challenge.lean uses only mathlib notions and fourteen documented definitions. The repository
    formalises, in its own terms and with every deviation recorded in DEVIATIONS.md, all statements
    of the paper except Conjecture 1.1 and Remarks 1.3, 7.5 and 8.4, in about 129,000 lines of Lean
    in 411 library modules; every audited declaration depends only on the standard axioms propext,
    Classical.choice and Quot.sound, and there is no sorry outside the deliberate one in
    Challenge.lean.
  authors:
    - "Lukas Niebel"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lukas Niebel"

