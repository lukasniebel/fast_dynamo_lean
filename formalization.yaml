status:
  scope: >-
    The compared theorem, FastDynamoChallenge.fast_dynamo_zero_entropy (Challenge.lean, proved in
    Solution.lean), is Theorem 1.2 of the paper in mathlib's terms: the velocity is Lipschitz and
    divergence free on Fourier coefficients; for every 0 < eps <= eps0 an induction semigroup on
    L^2_sigma exists and every strongly continuous semigroup whose generator agrees with
    curl(u x .) + eps Laplacian on H^2 and L^2_sigma has operator norm at least exp(gamma0 t) for all
    t >= 0; there is an eigenmode supported on the axial frequency K != 0 with eigenvalue of real
    part at least gamma0, and its real part is a non-zero datum whose orbit is
    Re(exp(t lambda) V) with norm exp(t Re lambda) times the initial norm; the particle flow
    exists and every time map of every flow is continuous with zero cover entropy; the ideal
    induction equation has exactly one solution group on L^2_sigma, and t^-1 log of its norm tends
    to 0. The library proves in addition, in its own terms: explicit witnesses eps0 and gamma0
    with gamma0 >= 288, the independence of the velocity of x3 and u != 0, Lemma A.1 (generation,
    analyticity, compactness, spectral mapping, the growth rate as a limit equal to the spectral
    bound), Remarks 1.4 to 1.7 (among them the theorem for the normalised velocity and the
    vanishing-diffusivity limit), the energy identity and the notions of dynamo of section 1.1,
    and every proposition, lemma and corollary of sections 2 to 8, Corollary 8.3 included. Not
    formalised: Conjecture 1.1 and Remarks 1.3, 7.5 and 8.4; the proof of Theorem 1.2 depends on
    none of them.
  # Excluding the deliberate sorry of Challenge.lean.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

