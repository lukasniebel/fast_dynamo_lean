name = "fast_dynamo"
version = "0.1.0"
defaultTargets = ["FastDynamo", "Solution"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "FastDynamo"

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_exe]]
name = "checkdecls"
root = "CheckDecls"
